<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ігри — Easy Peasy English</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7ff;--ink:#4a1f8f;--soft:#6b4aa8;--line:#d9c9f5;--pale:#efe6ff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;line-height:1.55;padding:28px 20px 56px}
main{max-width:760px;margin:0 auto}
.back{color:var(--soft);text-decoration:none;font-weight:700}
h1{font-size:2.2rem;margin:14px 0 4px;font-weight:900;line-height:1.1}
.sub{color:var(--soft);margin:0 0 24px}
.tabs{display:flex;gap:8px;margin:0 0 28px;flex-wrap:wrap}
.tab{font:inherit;font-weight:700;padding:9px 18px;border:2px solid var(--ink);border-radius:999px;background:none;color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff}
.tab:focus-visible,.game:focus-visible{outline:3px solid #a66bff;outline-offset:3px}
h2{font-size:1.4rem;margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.list{display:grid;gap:10px}
.game{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;background:#fff}
.game:hover{border-color:var(--ink)}
.game b{display:block}
.game span{font-size:.88rem;color:var(--soft)}
.tag{flex:none;font-weight:700;font-size:.9rem;padding:4px 12px;border-radius:999px;background:var(--pale)}
.tag.free{background:var(--ink);color:#fff}
.empty{color:var(--soft);padding:6px 2px}
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">‹ Easy Peasy English</a>
  <h1>Ігри за рівнями</h1>
  <p class="sub">Оберіть тему та рівень. Безкоштовні ігри відкриваються одразу.</p>

  <div class="tabs" id="tabs">
    <button class="tab" data-cat="grammar" aria-pressed="true">Граматика</button>
    <button class="tab" data-cat="vocab" aria-pressed="false">Vocabulary</button>
  </div>
  <div id="out"></div>
</main>

<script>
/* ДОДАВАЙТЕ ІГРИ СЮДИ. Один рядок = одна гра.
   cat: "grammar" або "vocab"; level: "A1","A2","B1","B2";
   title: назва; note: короткий опис;
   url: безкоштовна гра — шлях до папки (наприклад "present-simple-a2/"), платна — посилання WayForPay;
   free: true (безкоштовна) або false (платна); price: "99 грн" (для платних) */
var GAMES = [
  { cat:"grammar", level:"A2", title:"Present Simple", note:"Пробна гра", url:"present-simple-a2/", free:true },
  { cat:"grammar", level:"A2", title:"Past Simple", note:"20 завдань", url:"https://secure.wayforpay.com/ВСТАВТЕ", free:false, price:"99 грн" },
  { cat:"vocab", level:"A1", title:"Animals", note:"Для дітей", url:"animals-a1/", free:true }
];
var LEVELS = ["A1","A2","B1","B2"];
var cat = "grammar";
var out = document.getElementById("out");

function render(){
  var html = "";
  LEVELS.forEach(function(lv){
    var items = GAMES.filter(function(g){ return g.cat===cat && g.level===lv; });
    html += "<h2>" + lv + "</h2>";
    if(!items.length){ html += '<p class="empty">Скоро з’являться нові ігри.</p>'; return; }
    html += '<div class="list">';
    items.forEach(function(g){
      html += '<a class="game" href="' + g.url + '"><div><b>' + g.title + '</b><span>' + g.note + '</span></div>' +
        '<div class="tag' + (g.free ? ' free">Безкоштовно' : '">' + g.price) + '</div></a>';
    });
    html += "</div>";
  });
  out.innerHTML = html;
}
document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest(".tab"); if(!b) return;
  cat = b.dataset.cat;
  document.querySelectorAll(".tab").forEach(function(t){ t.setAttribute("aria-pressed", t===b ? "true" : "false"); });
  render();
});
render();
</script>
</body>
</html>
